      amount: { value: 1.4, unit: bn_eur_total, label: adopted, sources: [{ source: bd-konsolidierung, ref: "S. 47" }] }
  distribution:
    description: >-
      Laut Budgetdienst trägt das unterste Einkommensdezil etwas mehr als ein Fünftel des Volumens, das oberste 4 Prozent.
      Bis 2027 entfällt bei den betroffenen Leistungen ein Anstieg um knapp 5 Prozent.
    label: adopted
    sources:
      - { source: bd-konsolidierung, ref: "S. 47" }

unclear:
  - Für 2027 ist der ausgefallene Anpassungsfaktor noch nicht festgesetzt. Die Zahlen für das fünfte Jahr nutzen die Schätzung des Budgetdienstes.
  - Die Familienbeihilfe für Studierende geht meist an die Eltern. Bei AT-H4 ist offen, wer sie bezieht.
  - Ob ab 2028 die ausgefallenen Jahre nachgeholt werden, steht nicht im Gesetz. Die Karte nimmt an, dass nicht nachgeholt wird.

assumptions:
  - id: A1
    what: Ohne die Maßnahme wären die Beträge 2026 um 2,7 Prozent gestiegen.
    why: Das Familienlastenausgleichsgesetz verweist auf den Anpassungsfaktor der Pensionen; dieser ist für 2026 mit 1,027 festgesetzt.
    alternative: Keine; der Faktor ist verordnet.
  - id: A2
    what: Für 2027 wären die Beträge um weitere rund 2,2 Prozent gestiegen, zusammen knapp 5 Prozent.
    why: Der Budgetdienst rechnet mit knapp 5 Prozent bis 2027.
    alternative: Bei höherer Inflation 2026 wäre der Verlust größer, bei niedrigerer kleiner; Spannweite 4,4 bis 5,5 Prozent.
  - id: A3
    what: AT-H4 bezieht die Familienbeihilfe selbst.
    why: Der Beispielhaushalt nennt Familienbeihilfe als weiteres Einkommen.
    alternative: Geht die Beihilfe an die Eltern, ist die Wirkung für AT-H4 null und trifft den Elternhaushalt.

contradictions:
  - Die Budgetrede nennt 200 Millionen Euro für 2026 und 400 Millionen für 2027. Die WFA zu Art. 4 weist 114 und 210 Millionen aus, weil sie nur Familienbeihilfe und Mehrkindzuschlag umfasst. Mit Kinderabsetzbetrag, Kinderbetreuungsgeld und Familienzeitbonus kommt man auf die Größenordnung der Rede.

open_questions:
  - Anpassungsfaktor 2027 nach seiner Festsetzung im Herbst 2026 eintragen und A2 ersetzen.

