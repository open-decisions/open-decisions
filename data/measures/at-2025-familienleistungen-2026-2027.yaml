      amount: { value: 114, unit: mio_eur_per_year, label: adopted, year: 2026, sources: [{ source: bbg-wfa, ref: "S. 38 von 408" }] }
    - description: Minderausgaben des Bundes bei Familienbeihilfe und Mehrkindzuschlag ab 2027
      amount: { value: 210.4, unit: mio_eur_per_year, label: adopted, year: 2027, sources: [{ source: bbg-wfa, ref: "S. 38 von 408" }] }
