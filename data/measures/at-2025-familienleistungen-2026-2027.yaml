title: Familienbeihilfe und Kinderabsetzbetrag bleiben 2026 und 2027 gleich

status:
  state: in_force
  since: "2025-07-01"
  sources:
    - { source: bbg-gesetzestext, ref: "Art. 4 Z 13 (§ 55 Abs. 68 und 69 FLAG)" }
    - { source: parl-detail, ref: "status.bgbllinks, BGBl. I Nr. 25/2025" }

selection:
  status_ok: true
  household_relevance: indexation
  evidence_ok: true
  rationale: Betrifft 1,2 Millionen Familien mit einem festen Betrag pro Kind; Gesetzestext, WFA und Budgetdienst-Analyse liegen vor.
  decided_on: "2026-10-20"

said:
  quote: >-
    Schließlich werden Sozialleistungen wie die Familienbeihilfe oder der Kinderabsetzbetrag zwar nicht gekürzt,
    doch 2026 und 2027 werden sie nicht erhöht. Das vorübergehende Aussetzen der Indexierung ist aus budgetären
    Gründen notwendig, es erspart etwa 200 Millionen Euro im kommenden Jahr und 400 Millionen Euro 2027.
  speaker: Markus Marterbauer
  role: Bundesminister für Finanzen, Budgetrede zum Doppelbudget 2025/2026
  date: "2025-05-13"
  sources:
    - { source: budgetrede-protokoll, ref: "Stenographisches Protokoll, 21. Sitzung, TOP 1, Abschnitt Arbeitsmarkt und Soziales" }

law_change:
  summary: >-
    Familienbeihilfe, Mehrkindzuschlag, Kinderabsetzbetrag, Kinderbetreuungsgeld und Familienzeitbonus steigen sonst jedes Jahr mit der Inflation.
    Für 2026 und 2027 entfällt diese Anpassung. Die Beträge bleiben auf dem Stand von 2025.
  parameters:
    - name: Anpassung der Familienbeihilfe und des Mehrkindzuschlags an die Inflation
      old: "jährlich mit dem Anpassungsfaktor (§ 16 FLAG); für 2026 wäre das 2,7 Prozent"
      new: "keine Anpassung für 2026 und 2027"
      applies_from: "2026-01-01"
      sources:
        - { source: bbg-gesetzestext, ref: "Art. 4 Z 2 (§ 8 Abs. 2 bis 4) und Z 13 (§ 55 Abs. 68)" }
        - { source: anpassungsfaktor-2026, ref: "Anpassungsfaktor 2026: 1,027" }
    - name: Familienbeihilfe pro Monat, Kind ab 3 Jahren
      old: 148
      new: 148
      unit: EUR pro Monat, 2026 und 2027
      applies_from: "2026-01-01"
      sources:
        - { source: bbg-gesetzestext, ref: "Art. 4 Z 2 (§ 8 Abs. 2 lit. b)" }
        - { source: famvalvo-2025, ref: "§ 1 Z 4" }
    - name: Familienbeihilfe pro Monat, Kind ab 10 Jahren
      old: 171.8
      new: 171.8
      unit: EUR pro Monat, 2026 und 2027
      applies_from: "2026-01-01"
      sources:
        - { source: bbg-gesetzestext, ref: "Art. 4 Z 2 (§ 8 Abs. 2 lit. c)" }
    - name: Familienbeihilfe pro Monat, Kind ab 19 Jahren
      old: 200.4
      new: 200.4
      unit: EUR pro Monat, 2026 und 2027
      applies_from: "2026-01-01"
      sources:
        - { source: bbg-gesetzestext, ref: "Art. 4 Z 2 (§ 8 Abs. 2 lit. d)" }
    - name: Kinderabsetzbetrag pro Monat und Kind
      old: 70.9
      new: 70.9
      unit: EUR pro Monat, 2026 und 2027
      applies_from: "2026-01-01"
      sources:
        - { source: bbg-gesetzestext, ref: "Art. 56 Z 8 (§ 124b Z 474 EStG)" }
        - { source: famvalvo-2025, ref: "§ 4" }
    - name: Anpassung von Kinderbetreuungsgeld und Familienzeitbonus an die Inflation
      old: "jährlich"
      new: "keine Anpassung für 2026 und 2027"
      applies_from: "2026-01-01"
      sources:
        - { source: bbg-gesetzestext, ref: "Art. 5 (§ 50 Abs. 47 KBGG) und Art. 6 (§ 12 Abs. 10 FamZeitbG)" }

affected:
  who: Familien, die Familienbeihilfe beziehen, sowie Eltern mit Kinderbetreuungsgeld oder Familienzeitbonus
  condition: Anspruch auf Familienbeihilfe in den Jahren 2026 und 2027
  count:
    value: 1200000
    unit: households
    label: adopted
    sources:
      - { source: bbg-wfa, ref: "S. 39 von 408: 1,2 Millionen Familien, 2 Millionen Kinder" }

timing:
  effective_from: "2026-01-01"
  first_full_year: 2026
  fifth_year: 2030
  limited_until: "2027-12-31"
  transition: null
  indexation: none
  note: >-
    Ab 2028 wird wieder angepasst, aber vom Stand 2025 aus. Die zwei fehlenden Anpassungen werden nicht nachgeholt.
    Der Verlust bleibt deshalb auch im fünften Jahr bestehen.

