      long_term: { value: -142.7, low: -160, high: -130, unit: eur_per_year, label: estimated, year: 2030, assumptions: [A1, A2], sources: [{ source: bd-konsolidierung, ref: "S. 47" }], calculation: "242,70 € × 12 × 4,9 % = 142,70 €" }
      note: Familienbeihilfe und Kinderabsetzbetrag hängen nicht vom Einkommen ab.
  aggregate:
