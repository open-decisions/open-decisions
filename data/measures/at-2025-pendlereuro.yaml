      amount: { value: 0.7, unit: bn_eur_total, label: adopted, sources: [{ source: bd-konsolidierung, ref: "S. 48" }] }
  distribution:
    description: >-
      Laut Budgetdienst entfallen rund 80 Prozent des Volumens auf die obere Einkommenshälfte, weil Pendlerinnen und Pendler
      überwiegend Erwerbstätige mit höheren Einkommen sind. Für Haushalte mit Pendlern deckt der höhere Pendlereuro etwa ein Viertel
      des Verlusts aus dem Wegfall des Klimabonus ab.
    label: adopted
    sources:
      - { source: bd-konsolidierung, ref: "S. 48" }

unclear:
  - Die Wirkung hängt von den Kilometern und vom Anspruch auf das Pendlerpauschale ab. Die Beispielhaushalte haben dafür angenommene Arbeitswege.
  - Wer wegen des Familienbonus keine Steuer zahlt, bekommt den Pendlereuro nur als Negativsteuer. Dort gilt die Obergrenze von 737 Euro.
  - Der Betrag von 6 Euro ist nicht an die Inflation gebunden. Ob er später angepasst wird, ist offen.

assumptions:
  - id: A1
    what: Der Anspruch auf das Pendlerpauschale folgt aus dem Arbeitsweg der Beispielhaushalte in data/households/AT.yaml.
    why: Das Gesetz knüpft den Pendlereuro an das Pendlerpauschale; dieses braucht mindestens 20 Kilometer oder unzumutbaren öffentlichen Verkehr.
    alternative: Ein anderer Arbeitsweg ändert den Betrag im Verhältnis zu den Kilometern.
  - id: A2
    what: Bei AT-H3 ist der öffentliche Verkehr auf 15 Kilometern zumutbar.
    why: Stadtrand mit Anbindung; die zweite erwachsene Person fährt öffentlich.
    alternative: Ist er unzumutbar, besteht das kleine Pendlerpauschale ab 2 Kilometern und der Pendlereuro bringt rund 60 Euro.
  - id: A3
    what: AT-H6 hat genug Lohnsteuer, damit der volle Pendlereuro wirkt.
    why: Bei 3.400 Euro brutto im Monat liegt die Jahressteuer deutlich über 180 Euro.
    alternative: Keine; nur bei sehr niedrigen Einkommen greift die Obergrenze der Negativsteuer.

