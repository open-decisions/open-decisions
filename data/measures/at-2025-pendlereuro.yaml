title: Pendlereuro steigt 2026 von 2 auf 6 Euro

status:
  state: in_force
  since: "2025-07-01"
  sources:
    - { source: bbg-gesetzestext, ref: "Art. 56 Z 8 (§ 124b Z 475: erstmals für 2026)" }
    - { source: parl-detail, ref: "status.bgbllinks, BGBl. I Nr. 25/2025" }

selection:
  status_ok: true
  household_relevance: taxes
  evidence_ok: true
  rationale: Senkt die Lohnsteuer von Pendlerinnen und Pendlern um einen festen Betrag pro Kilometer; Gesetzestext, WFA und Budgetdienst-Analyse liegen vor.
  decided_on: "2026-10-20"

said:
  quote: >-
    Zum Ausgleich erhöht die Bundesregierung den Pendlereuro von 2 auf 6 Euro pro Kilometer und den
    Negativsteuerzuschlag für die Pendlerinnen und Pendler.
  speaker: Markus Marterbauer
  role: Bundesminister für Finanzen, Budgetrede zum Doppelbudget 2025/2026
  date: "2025-05-13"
  sources:
    - { source: budgetrede-protokoll, ref: "Stenographisches Protokoll, 21. Sitzung, TOP 1, Abschnitt Klimabonus" }

law_change:
  summary: >-
    Wer Anspruch auf das Pendlerpauschale hat, bekommt zusätzlich den Pendlereuro von der Steuer abgezogen.
    Ab dem Steuerjahr 2026 sind das 6 Euro pro Kilometer der einfachen Fahrtstrecke, bisher 2 Euro.
    Wer so wenig verdient, dass keine Steuer anfällt, bekommt mehr Negativsteuer: höchstens 737 statt 608 Euro.
  parameters:
    - name: Pendlereuro pro Kilometer einfacher Fahrtstrecke und Jahr
      old: 2
      new: 6
      unit: EUR
      applies_from: Steuerjahr 2026
      sources:
        - { source: bbg-gesetzestext, ref: "Art. 56 Z 6 (§ 33 Abs. 5 Z 4)" }
        - { source: ris-estg, ref: "§ 33 Abs. 5 Z 4" }
    - name: Höchstbetrag der SV-Rückerstattung bei Anspruch auf Pendlerpauschale
      old: 608
      new: 737
      unit: EUR pro Jahr
      applies_from: Steuerjahr 2026
      sources:
        - { source: bbg-gesetzestext, ref: "Art. 56 Z 7 (§ 33 Abs. 8 Z 2)" }

affected:
  who: Arbeitnehmerinnen und Arbeitnehmer mit Anspruch auf das Pendlerpauschale
  condition: Mindestens 20 Kilometer einfache Fahrtstrecke, oder öffentlicher Verkehr nicht zumutbar ab 2 Kilometern (§ 16 Abs. 1 Z 6 EStG)
  count:
    value: null
    unit: persons
    label: not_quantifiable
    reason: Weder die WFA noch der Budgetdienst nennen eine Zahl der Pendlerinnen und Pendler mit Pauschale.

timing:
  effective_from: "2026-01-01"
  first_full_year: 2026
  fifth_year: 2030
  limited_until: null
  transition: null
  indexation: none
  note: Der Betrag von 6 Euro pro Kilometer steht als fester Wert im Gesetz. Eine jährliche Anpassung ist dort nicht vorgesehen.

