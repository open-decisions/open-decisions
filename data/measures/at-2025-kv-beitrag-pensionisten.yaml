      amount: { value: 0.5, unit: bn_eur_per_year, label: adopted, year: 2026, sources: [{ source: bd-konsolidierung, ref: "S. 47" }] }
  distribution:
    description: >-
      Laut Budgetdienst tragen Haushalte mit höheren Einkommen einen größeren Anteil, weil höhere Pensionen in höhere Dezile fallen.
      Über 2025 bis 2029 reicht der Anteil von 3 Prozent im untersten bis 16 Prozent im obersten Dezil.
    label: adopted
    sources:
      - { source: bd-konsolidierung, ref: "S. 47 und 48" }

unclear:
  - Die höhere SV-Rückerstattung gibt es nur über die Steuererklärung. Ob sie bei AT-H2 ankommt, hängt davon ab, ob eine Veranlagung erfolgt.
  - Das Einfrieren der Rezeptgebühr 2026 wirkt nur bei Medikamentenbezug. Es ist hier nicht in Euro gerechnet.
  - Weder WFA noch Budgetdienst nennen die Zahl der Betroffenen.

assumptions:
  - id: A1
    what: Die Pension von AT-H2 bleibt nominell auf dem Stand von 2025 (1.270 Euro, 14-mal).
    why: Methodik, alles andere bleibt gleich; die Pensionsanpassung ist eine eigene Entscheidung.
    alternative: Mit jährlicher Pensionsanpassung wächst der Beitrag in Euro mit der Pension.
  - id: A2
    what: Die um 41 Euro höhere SV-Rückerstattung wird nur in der oberen Variante angerechnet.
    why: Sie setzt eine Arbeitnehmerveranlagung voraus; Bezieherinnen einer Ausgleichszulage erhalten sie nicht automatisch in jedem Fall.
    alternative: Mit Veranlagung sinkt der Verlust auf rund 120 Euro pro Jahr.

contradictions: []

open_questions:
  - Zahl der Pensionen in Österreich bei Statistik Austria oder dem Dachverband nachschlagen.
  - Prüfen, ob die höhere SV-Rückerstattung im BSMG 2025 II oder in einem anderen Gesetz steht; der Budgetdienst nennt nur die Beträge.

