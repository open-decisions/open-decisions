    - description: Zusätzliche Beiträge der Pensionistinnen und Pensionisten im Jahr 2025 (ab Juni)
      amount: { value: 366, unit: mio_eur_per_year, label: adopted, year: 2025, sources: [{ source: bd-konsolidierung, ref: "S. 19" }] }
    - description: Zusätzliche Beiträge der Pensionistinnen und Pensionisten ab 2026
      amount: { value: 0.7, unit: bn_eur_per_year, label: adopted, year: 2026, sources: [{ source: bd-konsolidierung, ref: "S. 19" }] }
