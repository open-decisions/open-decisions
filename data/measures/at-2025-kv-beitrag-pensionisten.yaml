title: Krankenversicherungsbeitrag für Pensionen steigt auf 6 Prozent

status:
  state: in_force
  since: "2025-06-01"
  sources:
    - { source: bsmg2-gesetzestext, ref: "Art. 8 Z 9 (Inkrafttreten § 73 Abs. 1 Z 1 und 2 mit 1. Juni 2025)" }
    - { source: parl-detail-91, ref: "status.bgbllinks, BGBl. I Nr. 20/2025" }

selection:
  status_ok: true
  household_relevance: pensions
  evidence_ok: true
  rationale: Betrifft alle Pensionen mit einem festen Prozentsatz; Gesetzestext, WFA und Budgetdienst-Analyse liegen vor.
  decided_on: "2026-10-20"

said:
  quote: >-
    Kurzfristig verbessern wir die Finanzierung des Gesundheitssystems über höhere Krankenversicherungsbeiträge
    für Pensionistinnen und Pensionisten, setzen aber gleichzeitig Maßnahmen, die ältere Menschen bei den
    Rezeptgebühren entlasten.
  speaker: Markus Marterbauer
  role: Bundesminister für Finanzen, Budgetrede zum Doppelbudget 2025/2026
  date: "2025-05-13"
  sources:
    - { source: budgetrede-protokoll, ref: "Stenographisches Protokoll, 21. Sitzung, TOP 1, Abschnitt Gesundheit" }

law_change:
  summary: >-
    Von jeder Pension wird ein Krankenversicherungsbeitrag einbehalten. Seit 1. Juni 2025 sind das 6 Prozent statt 5,1 Prozent.
    Wer eine Ausgleichszulage bezieht, zahlt den neuen Satz erst ab Jänner 2026.
  parameters:
    - name: Krankenversicherungsbeitrag von Pensionen und Pensionssonderzahlungen
      old: 5.1
      new: 6
      unit: Prozent der Bruttopension
      applies_from: "2025-06-01"
      sources:
        - { source: bsmg2-gesetzestext, ref: "Art. 8 Z 2" }
        - { source: ris-asvg, ref: "§ 73 Abs. 1 Z 1 und 2" }
    - name: Krankenversicherungsbeitrag bei Bezug einer Ausgleichszulage ohne Ausgleichszulagenbonus
      old: 5.1
      new: 6
      unit: Prozent der Bruttopension
      applies_from: "2026-01-01"
      sources:
        - { source: bsmg2-gesetzestext, ref: "Art. 8 Schlussbestimmungen Abs. 6" }
        - { source: bsmg2-wfa-bmasgpk, ref: "S. 5 von 13" }
    - name: Höchstbetrag der SV-Rückerstattung für Pensionen (Negativsteuer)
      old: 669
      new: 710
      unit: EUR pro Jahr
      applies_from: Veranlagung 2025
      sources:
        - { source: bd-konsolidierung, ref: "S. 18" }
    - name: Rezeptgebühr 2026
      old: "7,55 EUR, jährlich mit der Aufwertungszahl angepasst"
      new: "7,55 EUR, keine Anpassung für 2026"
      applies_from: "2026-01-01"
      sources:
        - { source: bsmg2-wfa-bmasgpk, ref: "S. 5 von 13, Maßnahme 2" }

affected:
  who: Alle Personen mit einer Pension aus der gesetzlichen Pensionsversicherung sowie Beamtinnen und Beamte im Ruhestand
  condition: Pension oder vergleichbare Leistung; für Beamte steigt der Satz von 4,9 auf 6 Prozent
  count:
    value: null
    unit: persons
    label: not_quantifiable
    reason: Weder die WFA noch der Budgetdienst nennen eine Zahl der betroffenen Personen.

timing:
  effective_from: "2025-06-01"
  first_full_year: 2026
  fifth_year: 2030
  limited_until: null
  transition: Bezieherinnen und Bezieher einer Ausgleichszulage ohne Bonus zahlen 2025 weiter 5,1 Prozent.
  indexation: not_applicable
  note: Der Satz ist ein Prozentsatz der Pension. Steigt die Pension, steigt auch der Beitrag in Euro.

