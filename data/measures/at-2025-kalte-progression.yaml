  distribution:
    description: >-
      Laut Budgetdienst entfallen 20 Prozent des Volumens auf das oberste Einkommensdezil und ein unterdurchschnittlicher Anteil auf die untere Hälfte.
      Das gilt unter der Annahme, dass das dritte Drittel sonst gleichmäßig verteilt worden wäre; in den Vorjahren bekamen untere Einkommen mehr.
    label: adopted
    sources:
      - { source: bd-konsolidierung, ref: "S. 46 und 47" }

unclear:
  - Die Wirkung pro Haushalt braucht eine Rechnung über den ganzen Steuertarif. Diese kommt mit der Modellanbindung in Phase 1.
  - Wie das dritte Drittel sonst verteilt worden wäre, ist unbekannt. Der Budgetdienst nimmt eine gleichmäßige Verteilung an.
  - Die Regierung kann das dritte Drittel weiterhin per Gesetz beschließen. Das Gesetz streicht nur die Pflicht dazu.

assumptions:
  - id: A1
    what: Für die Gesamtwirkung gilt die Rechnung des Budgetdienstes mit einer gleichmäßigen Verteilung des dritten Drittels.
    why: Es ist die einzige veröffentlichte Verteilungsrechnung zur Maßnahme.
    alternative: Wäre das dritte Drittel wie in den Vorjahren stärker unteren Einkommen zugutegekommen, träfe der Entfall diese stärker.

contradictions:
  - Die Budgetrede nennt fast 500 Millionen Euro für 2026 zusammen mit dem Spitzensteuersatz. Die WFA weist für das dritte Drittel allein 440 Millionen aus. Die Differenz ist der Spitzensteuersatz.

open_questions:
  - Wirkung pro Beispielhaushalt mit EUROMOD rechnen, sobald das Modell angebunden ist.
  - Zahl der Lohn- und Einkommensteuerpflichtigen aus der Statistik Austria ergänzen.

