selection:
  status_ok: true
  household_relevance: taxes
  evidence_ok: true
  rationale: Betrifft alle, die Lohn- oder Einkommensteuer zahlen; größte Einzelmaßnahme auf der Einnahmenseite; Gesetzestext, WFA und Budgetdienst-Analyse liegen vor.
  decided_on: "2026-10-20"

said:
  quote: >-
    2026 wird die Verlängerung des Spitzensteuersatzes für Jahreseinkommen von mehr als 1 Million Euro ebenso
    budgetwirksam wie das Aussetzen des dritten Drittels des Ausgleichs der kalten Progression. Das bringt bereits
    im Jahr 2026 zusammen einen Konsolidierungsbeitrag von fast 500 Millionen Euro, der bis zum Ende der
    Legislaturperiode auf etwa 1,5 Milliarden Euro steigen wird.
  speaker: Markus Marterbauer
  role: Bundesminister für Finanzen, Budgetrede zum Doppelbudget 2025/2026
  date: "2025-05-13"
  sources:
    - { source: budgetrede-protokoll, ref: "Stenographisches Protokoll, 21. Sitzung, TOP 1, Abschnitt Einnahmen" }
    - { source: budgetrede-bmf, ref: "S. 19" }

law_change:
  summary: >-
    Steigen die Löhne mit der Inflation, rutscht man in höhere Steuerstufen. Das nennt man kalte Progression.
    Seit 2023 werden die Steuerstufen und Absetzbeträge deshalb jedes Jahr angepasst: zwei Drittel automatisch, das dritte Drittel per Beschluss.
    Für die Steuerjahre 2026 bis 2029 entfällt dieses dritte Drittel.
  parameters:
    - name: Anteil der Inflation, um den Steuerstufen und Absetzbeträge angepasst werden
      old: "zwei Drittel automatisch plus ein Drittel per jährlichem Gesetz (§ 33a Abs. 5 und 6)"
      new: "nur zwei Drittel automatisch"
      applies_from: Steuerjahr 2026 bis 2029
      sources:
        - { source: bbg-gesetzestext, ref: "Art. 56 Z 8 (§ 124b Z 476: § 33a Abs. 5 und 6 bei den Anpassungen 2025 bis 2028 nicht anzuwenden)" }
        - { source: ris-estg, ref: "§ 33a" }
    - name: Entfallene zusätzliche Anpassung laut Budgetdienst
      old: "rund 1,2 Prozent im Jahr 2026, steigend auf rund 3,3 Prozent im Jahr 2029"
      new: "0 Prozent"
      applies_from: Steuerjahr 2026
      sources:
        - { source: bd-konsolidierung, ref: "S. 47, Fußnote 25" }

affected:
  who: Alle Personen, die Lohn- oder Einkommensteuer zahlen; bei Negativsteuer über die Absetzbeträge auch Geringverdienende
  condition: Steuerpflichtiges Einkommen über der Steuerfreigrenze oder Anspruch auf Negativsteuer
  count:
