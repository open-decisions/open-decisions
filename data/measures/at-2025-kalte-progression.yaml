timing:
  effective_from: "2026-01-01"
  first_full_year: 2026
  fifth_year: 2030
  limited_until: "2029-12-31"
  transition: null
  indexation: not_applicable
  note: >-
    Die Wirkung wächst jedes Jahr, weil die fehlenden Anpassungen sich aufsummieren.
    Ab dem Steuerjahr 2030 gilt wieder die volle Regel, aber die Stufen starten vom niedrigeren Stand.

