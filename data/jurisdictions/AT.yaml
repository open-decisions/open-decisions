note: >-
  Bund und neun Länder. Gemeinden folgen später; Wien ist Land und Gemeinde zugleich.
  Landesrecht und Landesgesetzblätter sind für alle Länder einheitlich über das RIS zugänglich (Anwendungen LrKons und LgblAuth).
  Die Landtage haben keine einheitliche Schnittstelle; Angaben zu den Landtagen sind noch nicht geprüft.
