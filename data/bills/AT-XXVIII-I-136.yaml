summary:
- Einführung einer Ermittlungsbefugnis zur Überwachung von Nachrichten, einschließlich verschlüsselter Kommunikation (§ 11
  Abs 1 Z 8 und 9 SNG)
- Neuregelung des Aufschubs der Berichtspflicht (§ 6 Abs 4 SNG)
- Einführung einer verpflichtenden Vertrauenswürdigkeitsprüfung für den Rechtsschutzbeauftragten sowie seine Stellvertreter
  (§ 91b Abs. 1a SPG)
- Erweiterung von Umständen, die zu einer Erlöschung der Bestellung bzw. Abberufung des Rechtsschutzbeauftragen führen (§
  91b Abs. 2 und 2a SPG)
- Aktualisierung der Verweise in § 161 und § 162 TKG
- Schaffung einer Rechtsgrundlage für eine Rufbereitschaft oder einen Journaldienst am Bundesverwaltungsgericht (§ 16a BVwGG
  und § 66 Abs. 3 RStDG)
