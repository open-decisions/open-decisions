summary:
- Der Bundesvoranschlag umfasst den Ergebnisvoranschlag und den Finanzierungsvoranschlag
- Der Ergebnisvoranschlag enthält die periodengerecht abgegrenzten Werteinsätze bzw. Wertzuwächse; der Finanzierungsvoranschlag
  enthält die im Finanzjahr 2027 anfallenden Aus- und Einzahlungen
