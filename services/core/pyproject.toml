[project]
name = "open-decisions-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "jsonschema>=4.23",
]

[project.scripts]
open-decisions-validate = "open_decisions_core.validate:main"
open-decisions-migrate = "open_decisions_core.db:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_decisions_core"]
