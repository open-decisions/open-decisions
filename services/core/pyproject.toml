[project]
name = "governmental-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "jsonschema>=4.23",
]

[project.scripts]
governmental-validate = "governmental_core.validate:main"
governmental-migrate = "governmental_core.db:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governmental_core"]
