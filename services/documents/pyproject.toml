[project]
name = "open-decisions-documents"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "open-decisions-core",
  "httpx>=0.27",
]

[project.scripts]
documents = "open_decisions_documents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_decisions_documents"]
