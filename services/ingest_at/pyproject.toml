[project]
name = "open-decisions-ingest-at"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "open-decisions-core",
  "httpx>=0.27",
]

[project.scripts]
ingest-at = "open_decisions_ingest_at.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_decisions_ingest_at"]

[dependency-groups]
dev = ["pytest>=8"]
