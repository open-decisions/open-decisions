[project]
name = "open-decisions-publish"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "open-decisions-core",
  "jinja2>=3.1",
]

[project.scripts]
publish = "open_decisions_publish.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_decisions_publish"]
