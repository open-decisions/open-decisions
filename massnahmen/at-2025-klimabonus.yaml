unclear:
  - Die regionale Stufe eines Wohnorts bestimmt den Betrag zwischen 145 und 290 Euro; für die Beispielhaushalte außerhalb Wiens ist sie angenommen, nicht nachgeschlagen.
  - Ohne Abschaffung wäre der Betrag ab 2025 per Verordnung an den CO2-Preis angepasst worden; wie hoch er gewesen wäre, ist nicht bekannt. Alle Zahlen schreiben den Wert von 2024 fort.
  - Die WFA nennt keine Zahl der Betroffenen und keine Wirkung pro Haushalt; die Einsparung von rund 2 Milliarden Euro pro Jahr stammt aus der Rechnung des Budgetdienstes.

assumptions:
  - id: A1
    what: Der Klimabonus wäre ohne Abschaffung ab 2025 in gleicher Höhe wie 2024 ausgezahlt worden.
    why: Konservativste Lesart; der Budgetdienst rechnet mit derselben Annahme (S. 46).
    alternative: Bei Anpassung an den gestiegenen CO2-Preis wäre der Verlust pro Person höher, besonders im fünften Jahr.
  - id: A2
    what: Wien ist Stufe 1 (nur Sockelbetrag, kein Regionalausgleich).
    why: Wien wird in der Klimabonus-Einstufung als urbanes Zentrum mit sehr gutem öffentlichem Verkehr geführt.
    alternative: Keine; die Einstufung Wiens ist eindeutig, wird aber gegen die Verordnung geprüft (offene Frage).
  - id: A3
    what: Für Landgemeinde Stufe 3 oder 4, für Stadtrand Stufe 2 oder 3, für Graz und Linz Stufe 1 oder 2.
    why: Die Beispielhaushalte haben keinen konkreten Wohnort; die Spannweite deckt die plausiblen Stufen ab.
    alternative: Ein konkreter Wohnort würde die Spannweite auf einen Wert verengen.
  - id: A4
    what: Für 2025 wäre der Klimabonus auch bei hohen Einkommen nicht steuerpflichtig gewesen.
    why: Die Steuerpflicht war nur für 2024 beschlossen (§ 6 Abs. 2 KliBG; Budgetdienst S. 46, Fußnote 24).
    alternative: Bei fortgeführter Steuerpflicht wäre der Nettoverlust für AT-H7 etwa halb so hoch.

contradictions:
  - Die WFA zu Art. 71 weist für 2025 eine Nettofinanzierung von minus 119 Millionen Euro aus (Abwicklung der Altansprüche), die Budgetrede nennt eine Einsparung von etwa 2 Milliarden Euro. Beides gilt, bezieht sich aber auf verschiedene Größen; die Einsparung steht nicht in der WFA-Tabelle.

open_questions:
  - Verordnung mit der Gemeinde-Einstufung 2024 nachschlagen und A2/A3 durch Fakten ersetzen.
  - Statistik Austria nach der Zahl der Hauptwohnsitz-Gemeldeten fragen, um die Betroffenen beziffern zu können.

