  distribution:
    description: >-
      Laut Budgetdienst verteilt sich das Volumen als einkommensunabhängige Maßnahme im Wesentlichen gleichmäßig
      auf die Einkommensdezile; Unterschiede ergeben sich aus dem Kinderanteil und der regionalen Stufe.
      Im Verhältnis zum Einkommen trifft der Wegfall niedrige Einkommen stärker.
    label: adopted
    sources:
