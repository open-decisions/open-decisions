law:
  title: Bundesgesetz über den regionalen Klimabonus
  abbreviation: KliBG
  original_gazette: BGBl. I Nr. 11/2022
  consolidated_url: https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20011840

title: Der Klimabonus wird nicht mehr ausgezahlt

status:
  state: in_force
  since: "2025-06-30"
  sources:
    - { source: ris-klibg-p2, ref: "§ 2, Inkrafttretensdatum" }
    - { source: parl-detail, ref: "status.bgbllinks" }

selection:
  status_ok: true
  household_relevance: transfers
  evidence_ok: true
  rationale: Betrifft fast alle Personen mit Hauptwohnsitz in Österreich mit einem festen Betrag pro Jahr; Gesetzestext, WFA und Budgetdienst-Analyse liegen vor.
  decided_on: "2026-10-19"

said:
  quote: >-
    Auf der Ausgabenseite bringt die Abschaffung des Klimabonus unmittelbar die größten Einsparungen.
    Sie betragen bereits heuer etwa 2 Milliarden Euro. Der Klimabonus war an sich ein politisch,
    wirtschaftlich und sozial sinnvoller Ausgleich zur Einführung der CO2-Bepreisung, doch er litt
    unter einer Reihe von Unzulänglichkeiten. Zuletzt wurden etwa doppelt so viele Mittel ausgezahlt
    wie eingenommen – das geht finanziell einfach nicht.
  speaker: Markus Marterbauer
  role: Bundesminister für Finanzen, Budgetrede zum Doppelbudget 2025/2026
  date: "2025-05-13"
  sources:
    - { source: budgetrede-protokoll, ref: "Stenographisches Protokoll, 21. Sitzung, TOP 1" }
    - { source: budgetrede-bmf, ref: "Volltext BMF" }

law_change:
  summary: >-
    Den Klimabonus gab es für die Jahre 2022 bis 2024. Für 2025 und später entsteht kein Anspruch mehr.
    Wer für 2022 bis 2024 noch Geld bekommen hätte, kann es weiterhin nachträglich beantragen.
  parameters:
    - name: Letztes Anspruchsjahr für den regionalen Klimabonus
      old: "unbefristet (jährlich)"
      new: "2024"
      applies_from: Kalenderjahr 2025
      sources:
        - { source: ris-klibg-p2, ref: "§ 2 Abs. 2 letzter Satz" }
        - { source: bbg-gesetzestext, ref: "Art. 71 Z 1" }
    - name: Sockelbetrag pro Person und Jahr (Stufe 1, zuletzt 2024)
      old: 145
      new: 0
      unit: EUR
      applies_from: Kalenderjahr 2025
      sources:
        - { source: ris-klibg-p3, ref: "§ 3 Abs. 1" }
    - name: Höchstbetrag pro Person und Jahr mit Regionalausgleich (Stufe 4, zuletzt 2024)
      old: 290
      new: 0
      unit: EUR
      applies_from: Kalenderjahr 2025
      sources:
        - { source: ris-klibg-p3, ref: "§ 3 Abs. 1 in Verbindung mit § 4" }
        - { source: bd-konsolidierung, ref: "S. 46" }
    - name: Betrag für Personen unter 18 Jahren
      old: "50 % des Erwachsenenbetrags"
      new: 0
      applies_from: Kalenderjahr 2025
      sources:
        - { source: ris-klibg-p3, ref: "§ 3 Abs. 2" }

affected:
  who: Alle Personen, die im Kalenderjahr mindestens 183 Tage mit Hauptwohnsitz in Österreich gemeldet waren, einschließlich Kinder
  condition: Hauptwohnsitz im Inland an mindestens 183 Tagen des Jahres (§ 2 Abs. 1 KliBG)
  count:
    value: null
    unit: persons
    label: not_quantifiable
    reason: Die WFA zu Art. 71 nennt keine Zahl der Anspruchsberechtigten; der Budgetdienst weist nur das Volumen aus.

timing:
  effective_from: "2025-06-30"
  first_full_year: 2025
  fifth_year: 2029
  limited_until: null
  transition: Ansprüche für 2022 bis 2024 können weiterhin nachträglich geltend gemacht werden (§ 9a KliBG).
  indexation: not_applicable
  note: >-
    Der weggefallene Betrag wäre laut § 4 KliBG per Verordnung an den CO2-Preis anzupassen gewesen.
    Der Verlust gegenüber dem alten Recht könnte also in späteren Jahren höher sein als der Wert von 2024 (siehe A1).

